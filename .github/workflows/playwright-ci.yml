name: Playwright CI

on:
  push:
    branches: [main, master, 'cursor/**']
  pull_request:
    branches: [main, master]
  schedule:
    # 8:00 AM IST = 02:30 UTC (GitHub Actions cron uses UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - prod-modules
          - control-tower
          - fast

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (${{ github.event.inputs.suite || 'all' }})
    timeout-minutes: 180
    runs-on: ubuntu-latest

    env:
      CI: true
      PACE_FAST: false
      BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL || 'https://goldenpasslng.pace-os.com/' }}
      TEST_EMAIL: ${{ vars.TEST_EMAIL || secrets.TEST_EMAIL || vars.EMAIL || secrets.EMAIL }}
      TEST_PASSWORD: ${{ vars.TEST_PASSWORD || secrets.TEST_PASSWORD || vars.PASSWORD || secrets.PASSWORD }}
      PROD_USE_FIRST_PROJECT: ${{ vars.PROD_USE_FIRST_PROJECT || 'true' }}
      PROD_PROJECT_NAME: ${{ vars.PROD_PROJECT_NAME }}
      PROD_PHASE: ${{ vars.PROD_PHASE || 'Process Train - 2' }}
      PROD_SECTION: ${{ vars.PROD_SECTION || '2200 - Main Piperack' }}
      PROD_BLOCK: ${{ vars.PROD_BLOCK || '2210-Main Piperack (Level - 5)' }}
      CONTROL_TOWER_PORTFOLIO_URL: ${{ vars.CONTROL_TOWER_PORTFOLIO_URL || 'https://us-controltower.pace-os.com/#/portfolio?page=1' }}
      PLAYWRIGHT_WORKERS: ${{ vars.PLAYWRIGHT_WORKERS || '4' }}
      CT_WORKERS: ${{ vars.CT_WORKERS || '4' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO }}
      EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || '[PACE QA Daily]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create CI env file
        run: node scripts/create-ci-env.js

      - name: Validate environment
        run: node scripts/validate-ci-env.js

      - name: Run all suites
        id: run-all
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'all' }}
        continue-on-error: true
        run: npx playwright test --project=prod-modules-email --project=control-tower-reports-email --workers=4

      - name: Run prod modules only
        id: run-prod-modules
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'prod-modules' }}
        continue-on-error: true
        run: npx playwright test --project=prod-modules-email

      - name: Run Control Tower only
        id: run-control-tower
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'control-tower' }}
        continue-on-error: true
        run: npx playwright test --project=control-tower-reports-email --workers=4

      - name: Run fast smoke
        id: run-fast
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'fast' }}
        continue-on-error: true
        env:
          PACE_FAST: true
        run: npx playwright test --project=prod-modules-email --project=control-tower-reports-email --workers=4

      - name: Send test report email
        if: always()
        run: node scripts/send-test-report-email.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 14

      - name: Fail job if tests failed
        if: |
          (steps.run-all.outcome == 'failure') ||
          (steps.run-prod-modules.outcome == 'failure') ||
          (steps.run-control-tower.outcome == 'failure') ||
          (steps.run-fast.outcome == 'failure')
        run: exit 1
