name: Playwright CI

on:
  push:
    branches: [main, master, 'cursor/**']
  pull_request:
    branches: [main, master]
  schedule:
    # 8:00 AM IST = 02:30 UTC (GitHub Actions cron uses UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - prod-only
          - dev3-only
          - prod-modules
          - control-tower
          - dev3-modules
          - dev3-control-tower
          - fast

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  PACE_FAST: false
  ENABLE_DEV3_CI: ${{ vars.ENABLE_DEV3_CI != 'false' }}
  BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL || 'https://goldenpasslng.pace-os.com/' }}
  TEST_EMAIL: ${{ vars.TEST_EMAIL || secrets.TEST_EMAIL || vars.EMAIL || secrets.EMAIL }}
  TEST_PASSWORD: ${{ vars.TEST_PASSWORD || secrets.TEST_PASSWORD || vars.PASSWORD || secrets.PASSWORD }}
  DEV3_TEST_EMAIL: ${{ secrets.DEV3_TEST_EMAIL || vars.DEV3_TEST_EMAIL || secrets.TEST_EMAIL || vars.TEST_EMAIL }}
  DEV3_TEST_PASSWORD: ${{ secrets.DEV3_TEST_PASSWORD || vars.DEV3_TEST_PASSWORD || secrets.TEST_PASSWORD || vars.TEST_PASSWORD }}
  PROD_USE_FIRST_PROJECT: ${{ vars.PROD_USE_FIRST_PROJECT || 'true' }}
  PROD_PROJECT_NAME: ${{ vars.PROD_PROJECT_NAME }}
  PROD_PHASE: ${{ vars.PROD_PHASE || 'Process Train - 2' }}
  PROD_SECTION: ${{ vars.PROD_SECTION || '2200 - Main Piperack' }}
  PROD_BLOCK: ${{ vars.PROD_BLOCK || '2210-Main Piperack (Level - 5)' }}
  CONTROL_TOWER_PORTFOLIO_URL: ${{ vars.CONTROL_TOWER_PORTFOLIO_URL || 'https://us-controltower.pace-os.com/#/portfolio?page=1' }}
  PLAYWRIGHT_WORKERS: ${{ vars.PLAYWRIGHT_WORKERS || '4' }}

jobs:
  prod-modules:
    name: Prod — Modules (4 workers)
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all","prod-only","prod-modules","fast"]'), github.event.inputs.suite) }}
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/create-ci-env.js
      - run: node scripts/validate-ci-env.js
      - name: Run prod modules
        env:
          PLAYWRIGHT_JSON_OUTPUT: report-prod-modules.json
          PACE_FAST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'fast' && 'true' || 'false' }}
        run: npx playwright test --project=prod-modules-email --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-prod-modules-${{ github.run_id }}
          path: test-results/
          retention-days: 14

  control-tower:
    name: Prod — Control Tower (4 workers)
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all","prod-only","control-tower","fast"]'), github.event.inputs.suite) }}
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/create-ci-env.js
      - run: node scripts/validate-ci-env.js
      - name: Run Control Tower reports
        env:
          PLAYWRIGHT_JSON_OUTPUT: report-control-tower.json
          PACE_FAST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'fast' && 'true' || 'false' }}
        run: npx playwright test --project=control-tower-reports-email tests/Control-tower-reports/reports --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-prod-ct-${{ github.run_id }}
          path: test-results/
          retention-days: 14

  dev3-prod-modules:
    name: Dev3 — Modules (4 workers)
    if: >-
      ${{ env.ENABLE_DEV3_CI == 'true'
      && (github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all","dev3-only","dev3-modules"]'), github.event.inputs.suite)) }}
    timeout-minutes: 180
    runs-on: ubuntu-latest
    env:
      PACE_ENV: dev3
      TEST_EMAIL: ${{ secrets.DEV3_TEST_EMAIL || vars.DEV3_TEST_EMAIL || secrets.TEST_EMAIL || vars.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.DEV3_TEST_PASSWORD || vars.DEV3_TEST_PASSWORD || secrets.TEST_PASSWORD || vars.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/create-ci-env.js
      - run: node scripts/validate-ci-env.js
      - name: Run dev3 modules
        env:
          PLAYWRIGHT_JSON_OUTPUT: report-dev3-modules.json
        run: npx playwright test --project=prod-modules-email --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-dev3-modules-${{ github.run_id }}
          path: test-results/
          retention-days: 14

  dev3-control-tower:
    name: Dev3 — Control Tower (1 worker)
    if: >-
      ${{ env.ENABLE_DEV3_CI == 'true'
      && (github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all","dev3-only","dev3-control-tower"]'), github.event.inputs.suite)) }}
    timeout-minutes: 180
    runs-on: ubuntu-latest
    env:
      PACE_ENV: dev3
      TEST_EMAIL: ${{ secrets.DEV3_TEST_EMAIL || vars.DEV3_TEST_EMAIL || secrets.TEST_EMAIL || vars.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.DEV3_TEST_PASSWORD || vars.DEV3_TEST_PASSWORD || secrets.TEST_PASSWORD || vars.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/create-ci-env.js
      - run: node scripts/validate-ci-env.js
      - name: Run dev3 Control Tower reports
        env:
          PLAYWRIGHT_JSON_OUTPUT: report-dev3-control-tower.json
        run: npx playwright test --project=control-tower-reports-email --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-dev3-ct-${{ github.run_id }}
          path: test-results/
          retention-days: 14

  report:
    name: Report and notify
    needs: [prod-modules, control-tower, dev3-prod-modules, dev3-control-tower]
    if: always()
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST || 'smtp.office365.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER || 'mayankd@teknobuilt.com' }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM || 'mayankd@teknobuilt.com' }}
      EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO || 'mayankd@teknobuilt.com' }}
      EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || '[PACE QA Daily Report]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Download prod modules results
        if: needs.prod-modules.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: test-results-prod-modules-${{ github.run_id }}
          path: test-results
      - name: Download prod Control Tower results
        if: needs.control-tower.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: test-results-prod-ct-${{ github.run_id }}
          path: test-results
      - name: Download dev3 modules results
        if: needs.dev3-prod-modules.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: test-results-dev3-modules-${{ github.run_id }}
          path: test-results
      - name: Download dev3 Control Tower results
        if: needs.dev3-control-tower.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: test-results-dev3-ct-${{ github.run_id }}
          path: test-results
      - run: node scripts/create-ci-env.js
      - name: Send test report email
        run: node scripts/send-test-report-email.js
      - name: Fail if any test job failed
        if: >-
          contains(fromJSON('["failure"]'), needs.prod-modules.result)
          || contains(fromJSON('["failure"]'), needs.control-tower.result)
          || contains(fromJSON('["failure"]'), needs.dev3-prod-modules.result)
          || contains(fromJSON('["failure"]'), needs.dev3-control-tower.result)
        run: exit 1
